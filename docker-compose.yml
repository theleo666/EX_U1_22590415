services:
  db:
    image: postgres:16
    restart: no
    environment:
      POSTGRES_DB: blog_tec
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123455asdasd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - blog_tec

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://admin:123455asdasd@db:5432/blog_tec
    networks:
      - blog_tec
    depends_on:
      - db

volumes:
  postgres_data:

networks:
  blog_tec:
    external: true